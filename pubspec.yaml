name: citizenship_quest
description: "Citizenship Quest - Sprint 1"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.0

  # Almacenamiento local: JSON plano con escritura atómica
  # (ver lib/core/local_storage_service.dart). Sin generación de código,
  # sin build_runner, sin dependencias nativas de bases de datos.
  path_provider: ^2.1.5

  # Utilidades
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.0.5

  # Notificaciones locales (recordatorio diario, 100% offline)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/preguntas.json
